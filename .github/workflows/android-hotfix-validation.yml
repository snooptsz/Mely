name: M3LY Android hotfix validation

# Evidence-only validation. Never run automatically on pushes: GitLab remains
# canonical and routine M3LY development must not consume hosted CI usage.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-pairing-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Verify legacy-safe live pairing response
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, secrets, urllib.request
          ref = 'd_' + base64.urlsafe_b64encode(secrets.token_bytes(24)).decode().rstrip('=')
          secret = base64.urlsafe_b64encode(secrets.token_bytes(32)).decode().rstrip('=')
          body = json.dumps({'device_ref': ref, 'device_secret': secret, 'platform': 'android'}).encode()
          req = urllib.request.Request(
              'https://sweclfuqpsbvcheqxfyh.supabase.co/functions/v1/m3ly-api/v1/device-pairings',
              data=body,
              headers={'content-type': 'application/json', 'accept': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              assert response.status == 201, response.status
              data = json.loads(response.read())
          path = data['browser_path']
          assert path.startswith('/pair.html?'), path
          assert '#pairing_ref=' in path and '&pairing_proof=' in path, path
          query, fragment = path.split('#', 1)
          assert 'pairing_proof=' not in query, 'proof leaked into HTTP query'
          assert len(data['pairing_ref']) == 36
          assert len(data['pairing_proof']) == 43
          print('legacy pairing contract PASS:', query, fragment.split('&')[0])
          PY

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 36 platform
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Lint and build side-by-side validation APK
        working-directory: android-hotfix-harness
        run: gradle --no-daemon lintDebug assembleDebug
      - name: Record artifact hash
        run: sha256sum android-hotfix-harness/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: M3LY-Android-hotfix-validation
          path: android-hotfix-harness/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
